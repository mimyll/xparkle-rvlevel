name: Validate and release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed manifest version after all checks pass
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  product:
    strategy:
      fail-fast: false
      matrix:
        ha: ["2026.11.0", "2026.11.2"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      HA_TEST_VERSION: ${{ matrix.ha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install pinned test inputs
        run: |
          python - <<'PY_VERSION'
          import os
          from pathlib import Path
          version = os.environ["HA_TEST_VERSION"]
          assert version in ("2026.11.0", "2026.11.2")
          for name in ("requirements-test.txt", "constraints.txt"):
              text = (Path("ci") / name).read_text().replace("homeassistant==2026.11.0", "homeassistant==" + version)
              (Path("/tmp") / ("xparkle-" + name)).write_text(text)
          PY_VERSION
          python -m pip install --disable-pip-version-check -r /tmp/xparkle-requirements-test.txt -c /tmp/xparkle-constraints.txt
      - name: Verify curated files and build
        run: python script/verify_release.py
      - name: Run synthetic and native HA tests
        run: python -m pytest -q -p pytest_asyncio.plugin -p no:cacheprovider --junitxml=ci-results/product-tests.xml tests
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/frontend/run_browser.py
  hassfest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Official validator wrapper is pinned; its upstream validator image tracks HA.
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
  hacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Official validator wrapper is pinned; its upstream image tracks HACS.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: false
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [product, frontend, hassfest, hacs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python script/verify_release.py
      - name: Publish exact checked commit and deterministic assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION=$(python -c 'import json; print(json.load(open("custom_components/xparkle_rvlevel/manifest.json"))["version"])')
          test "$RELEASE_VERSION" = "0.5.1"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_VERSION" -f sha="$GITHUB_SHA" >/dev/null
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION" --jq '.object.sha')
          test "$TAG_SHA" = "$GITHUB_SHA"
          gh release create "$RELEASE_VERSION" --verify-tag --title "Xparkle RV level $RELEASE_VERSION" --notes-file RELEASE.md build/xparkle-rvlevel-0.5.1.zip build/SHA256SUMS build/component-files.json
